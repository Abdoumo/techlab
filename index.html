<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="cyberlymph - Enterprise Tech Solutions" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="cyberlymph" />
    <title>cyberlymph - Enterprise Tech Solutions</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Zero2AI / Cyberlymph — Source Code & DevTools Protection -->
    <script>
      /**
       * Zero2AI — Source Code Protection
       * Blocks DevTools, right-click, keyboard shortcuts, text selection,
       * and detects DevTools opening via debugger traps & size detection.
       */
      (function () {
        'use strict';

        // ─── 1. Disable Right-Click Context Menu ───
        document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
          return false;
        });

        // ─── 2. Block Keyboard Shortcuts (Windows / Linux / Mac) ───
        document.addEventListener('keydown', function (e) {
          var isCmdOrCtrl = e.ctrlKey || e.metaKey;

          // F12
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
          }

          // Ctrl+Shift+I / Cmd+Opt+I (Inspect Element)
          if (
            (isCmdOrCtrl && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) ||
            (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73))
          ) {
            e.preventDefault();
            return false;
          }

          // Ctrl+Shift+J / Cmd+Opt+J (Console)
          if (
            (isCmdOrCtrl && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) ||
            (e.metaKey && e.altKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74))
          ) {
            e.preventDefault();
            return false;
          }

          // Ctrl+Shift+C / Cmd+Opt+C (Inspect picker)
          if (
            (isCmdOrCtrl && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) ||
            (e.metaKey && e.altKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67))
          ) {
            e.preventDefault();
            return false;
          }

          // Ctrl+U / Cmd+Opt+U (View Source)
          if (
            (isCmdOrCtrl && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) ||
            (e.metaKey && e.altKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85))
          ) {
            e.preventDefault();
            return false;
          }

          // Ctrl+S / Cmd+S (Save Page)
          if (isCmdOrCtrl && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
            e.preventDefault();
            return false;
          }

          // Ctrl+Shift+K (Firefox Console)
          if (isCmdOrCtrl && e.shiftKey && (e.key === 'K' || e.key === 'k' || e.keyCode === 75)) {
            e.preventDefault();
            return false;
          }

          // Ctrl+Shift+M (Responsive Design Mode)
          if (isCmdOrCtrl && e.shiftKey && (e.key === 'M' || e.key === 'm' || e.keyCode === 77)) {
            e.preventDefault();
            return false;
          }
        });

        // ─── 3. Disable Text Selection (Preserve input/textarea for form usability) ───
        document.addEventListener('selectstart', function (e) {
          var target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
            return true;
          }
          e.preventDefault();
          return false;
        });

        // ─── 4. Disable Drag ───
        document.addEventListener('dragstart', function (e) {
          e.preventDefault();
          return false;
        });

        // ─── 5. Disable Copy (Preserve input/textarea for form usability) ───
        document.addEventListener('copy', function (e) {
          var target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
            return true;
          }
          e.preventDefault();
          return false;
        });

        // ─── 6. DevTools Detection via Window Size ───
        var devtoolsOpen = false;

        function checkDevTools() {
          var widthThreshold = window.outerWidth - window.innerWidth > 160;
          var heightThreshold = window.outerHeight - window.innerHeight > 160;

          if (widthThreshold || heightThreshold) {
            if (!devtoolsOpen) {
              devtoolsOpen = true;
              onDevToolsDetected();
            }
          } else {
            devtoolsOpen = false;
          }
        }

        function onDevToolsDetected() {
          if (document.body) {
            document.body.innerHTML =
              '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#f0f0f5;font-family:Inter,system-ui,sans-serif;text-align:center;flex-direction:column;padding:20px;">' +
              '<h1 style="font-size:3.5rem;margin-bottom:16px;">⛔</h1>' +
              '<h2 style="font-size:1.75rem;font-weight:700;margin-bottom:8px;">Accès interdit</h2>' +
              '<p style="color:#9494a8;max-width:420px;line-height:1.5;">Les outils de développement sont désactivés sur cette page.</p>' +
              '</div>';
          }
        }

        setInterval(checkDevTools, 1000);

        // ─── 7. Debugger Trap ───
        (function loop() {
          setTimeout(function () {
            (function () {
              return false;
            }['constructor']('debugger')['call']());
            loop();
          }, 2000);
        })();

        // ─── 8. Console log override ───
        var noop = function () {};
        try {
          Object.defineProperty(window, 'console', {
            get: function () {
              return {
                log: noop,
                warn: noop,
                error: noop,
                info: noop,
                debug: noop,
                dir: noop,
                table: noop,
                trace: noop,
                assert: noop,
                clear: noop,
                count: noop,
                group: noop,
                groupEnd: noop,
                time: noop,
                timeEnd: noop,
              };
            },
            set: function () {},
          });
        } catch (e) {}

        // ─── 9. CSS Protection ───
        var style = document.createElement('style');
        style.textContent = `
          * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
          }
          input, textarea, select {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
          }
        `;
        document.head.appendChild(style);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
